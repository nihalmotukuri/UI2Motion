[project]
name = "ui2motion"
version = "0.1.0"
description = "Token-grounded UI visual profile & motion choreography compiler powered by UI2Motion-7B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "typer>=0.12.0",
]

[project.scripts]
ui2motion = "ui2motion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
